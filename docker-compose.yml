name: oodo-nmit
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./frontend/src:/var/www/html
    networks:
      - app-network
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:5000
      - APP_ENV=local
      - APP_DEBUG=true
    stdin_open: true  # ← keeps STDIN open for docker exec
    tty: true         # ← allocates a pseudo-TTY
    command: /bin/bash # ← stays alive; run `php artisan serve` manually inside

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend/app:/app
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DATABASE_URL=postgresql://appuser:apppassword@db:5432/appdb
      - JWT_SECRET_KEY=dayflow-jwt-secret-2026
      - FLASK_APP=app.py
      - FLASK_ENV=development
    stdin_open: true  # ← keeps STDIN open for docker exec
    tty: true         # ← allocates a pseudo-TTY
    command: /bin/bash # ← stays alive; run flask manually inside

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - app-network
    environment:
      - POSTGRES_DB=appdb
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=apppassword
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
